# Render Blueprint for the cooperative server (FastAPI + SQLite).
# Free plan: the service sleeps when idle and its disk is wiped on restart/redeploy.
# The server reseeds the SYNTHETIC registry on startup when the database is empty.
services:
  - type: web
    name: jirani-coop
    runtime: python
    plan: free
    buildCommand: pip install -r server/requirements.txt
    startCommand: uvicorn main:app --app-dir server --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SMS_PROVIDER          # mock only in the hackathon build: alerts are written as "would be sent"
        value: mock
      - key: APP_ORIGIN            # the Vercel app URL, e.g. https://jirani-xyz.vercel.app
        sync: false
