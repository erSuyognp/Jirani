<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#002244">
<title>{% block title %}Jirani{% endblock %}</title>
<link rel="icon" href="/static/icon.svg" type="image/svg+xml">
{% block head %}{% endblock %}
<style>
  /* Same navy / cyan palette as the farmer app (app/src/ui/styles.css) */
  :root {
    --brand:#002244; --brand-2:#009fda; --brand-tint:#e6f5fb; --accent-ink:#00608a;
    --bg:#f2f5f8; --surface:#fff; --ink:#0f1b2a; --ink-2:#33414f; --muted:#55606e; --line:#e1e6ec; --line-strong:#c5ced8;
    --ok:#1b7f3b; --ok-bg:#e7f5ec; --warn:#8a5a00; --warn-fill:#d98a00; --warn-bg:#fff4d6; --bad:#b3261e; --bad-bg:#fdecea;
    --syn:#5b3fb0; --syn-bg:#ece6fb;
  }
  * { box-sizing:border-box; }
  html { scroll-behavior:smooth; }
  body { margin:0; font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--ink); background:var(--bg); -webkit-text-size-adjust:100%; }
  h1,h2,h3,p { margin:0; }
  a { color:var(--accent-ink); }
  .i { flex:none; vertical-align:-3px; }
  .wrap { max-width:1200px; margin:0 auto; padding:0 24px; }
  .brand { display:flex; align-items:center; gap:10px; color:#fff; font-size:20px; font-weight:800; text-decoration:none; letter-spacing:.01em; }
  .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; min-height:44px; padding:8px 18px; border-radius:12px; border:1.5px solid transparent; font:inherit; font-weight:700; text-decoration:none; cursor:pointer; transition:background .15s, transform .08s; }
  .btn:active { transform:scale(.98); }
  .btn.primary { background:var(--brand); color:#fff; }
  .btn.primary:hover { background:#0a3a66; }
  .btn.accent { background:#fff; color:var(--brand); }
  .btn.accent:hover { background:var(--brand-tint); }
  .btn.ghost { background:transparent; color:#fff; border-color:rgba(255,255,255,.55); }
  .btn.ghost:hover { background:rgba(255,255,255,.12); }
  .btn.outline { background:var(--surface); color:var(--brand); border-color:var(--line-strong); }
  .btn.outline:hover { background:var(--brand-tint); }
  :focus-visible { outline:3px solid var(--brand-2); outline-offset:2px; }
  .chip { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:99px; font-size:12.5px; font-weight:700; white-space:nowrap; background:#eef2f6; color:var(--muted); }
  .chip.syn { background:var(--syn-bg); color:var(--syn); }
  .chip.ok { background:var(--ok-bg); color:var(--ok); }
  .chip.warn { background:var(--warn-bg); color:var(--warn); }
  .chip.bad { background:var(--bad-bg); color:var(--bad); }
  .chip.info { background:var(--brand-tint); color:var(--accent-ink); }
  .muted { color:var(--muted); }
  .small { font-size:13.5px; }
  .site-foot { padding:28px 0 36px; color:var(--muted); font-size:13.5px; }
  .site-foot .wrap { display:flex; flex-wrap:wrap; gap:8px 24px; justify-content:space-between; }
{% block style %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
